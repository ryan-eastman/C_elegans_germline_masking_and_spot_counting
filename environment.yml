# Conda fallback (you already use miniconda). Primary env is pixi.toml.
#   conda env create -f environment.yml && conda activate germquant
#   pip install -e .
# On the RTX 5090 / HPC the cu128 torch wheel below provides Blackwell (sm_120) support.
name: germquant
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - numpy>=1.26,<2.2
  - scipy
  - scikit-image=0.24
  - pandas=2.2
  - pyarrow>=14
  - pyyaml>=6
  - matplotlib-base>=3.7
  - dask>=2024.1
  - tifffile>=2024.1
  - snakemake-minimal>=8
  - snakemake-executor-plugin-slurm
  - pip
  - pip:
      - nd2>=0.10
      # GPU stack — comment out on a CPU-only machine:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch>=2.7
      - cellpose>=3.1
      - -e .
