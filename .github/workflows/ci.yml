# Continuous integration: lint and the CPU test suite on Linux, Windows and macOS (Apple Silicon).
#
# What runs: `ruff check src tests scripts`, then `pytest -m "not model"`, which is the whole unit
# suite including the synthetic golden tests (tests/test_golden.py). Those process two synthetic
# gonads with the classical nucleus segmenter and SpotMAX and compare every output table cell for
# cell with the references checked in under tests/golden/. tests/test_gpu.py skips itself without an
# accelerator, and tests marked "model" (large model weights) are deselected here, so nothing in this
# workflow downloads the 1.2 GB nucleus model. The markers are described in tests/README.md.
#
# On tranche 5 branches the Linux job also runs the T5 scope check (scripts/t5_scope_check.py), which
# fails a diff that modifies or deletes a frozen path or changes an existing fence pin
# (docs/DESIGN_system_packs.md section 11.2), and then the T5 style check (scripts/t5_style_check.py,
# gate G7), which fails an en or em dash in a line the diff adds, and a non-ASCII character in a text
# file it adds under config/, packs/, tests/fixtures/ or tests/golden/ or in any YAML file it adds. A
# tranche 5 branch name contains "tranche5" or a path segment that starts with "t5", for example
# feat/t5-p1.
#
# Environment: Python 3.11 (the version the pinned environments target), installed with uv against
# constraints/ci-cpu-2026-10.txt, which is the validated workstation set minus the CUDA-only packages,
# with torch and torchvision as CPU wheels from the PyTorch CPU index. The macos-15 job (arm64, gate G1 of
# docs/DESIGN_system_packs.md) installs against constraints/ci-mac-arm64-2026-10.txt, the same pins with torch
# taken from PyPI (the macOS arm64 wheel). A test that cannot pass on macOS for an environment reason is
# marked with the reason and listed in the PR. Every job then installs the two bioio TIFF readers
# (bioio, bioio-base, bioio-tifffile and bioio-ome-tiff) against constraints/readers-2026-10.txt, the
# versions of the workstation .venv, so the bioio paths of germquant.io (single-plane and OME-TIFF reads)
# are tested on all three systems (design O4; Q3 of the Train B answers in design section 14).
# astral-sh/setup-uv saves the uv cache directory between runs (enable-cache), keyed on pyproject.toml and
# the constraints files.
#
# macOS runner: macos-15 (the macOS 15 arm64 image, Apple Silicon) since 2026-10-30, macos-14 before. GitHub
# retires the macOS 14 images on 2026-11-02 and fails macos-14 jobs in scheduled brownouts until then
# (github.com/actions/runner-images issue 13518). macos-15 is the same Apple Silicon runner class one release
# newer, so the Mac constraints file, the PyPI torch wheel, golden_rtol and G1's budget carry over unchanged.
# The label names the macOS version, as GitHub advises for avoiding unwanted moves: macos-latest moves to each
# new macOS (it is macOS 26 today). Design section 14 records the change (its macOS note of 2026-10-30).
#
# Budget (gate G1 of docs/DESIGN_system_packs.md): 15 minutes per job, and each PR records the CI time
# it adds. windows-latest took 15.4 minutes on main 8eb73de (its Test step 13.9), so its tests run in
# two jobs, shards 0 and 1: a shard takes every other file of the sorted tests/test_*.py list, and the
# two together run every test file once. ubuntu-latest and macos-15 keep one job (shard "all"). If a
# Windows shard passes the budget, rebalance the shards (the rule in the Test step) before trimming
# tests (design section 14, the Train B answers of 2026-10-23). A rehearsal of the install and test
# commands in a fresh environment on the workstation is recorded in tests/README.md; it dates from
# 2026-10-09, before the Windows split and the readers step.
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cell-ACDC and SpotMAX are Qt applications. Offscreen keeps any Qt import that does happen away
  # from a display on the headless runners; set for the whole job so collection sees it too.
  QT_QPA_PLATFORM: offscreen
  # GERMQUANT_GOLDEN_RTOL is set per platform in the matrix below (golden_rtol): the runners sum floats in a
  # different vector order than the workstation (tests/README.md).
  # No runner has a GPU. The value -1 (not an empty string, which Windows drops from the
  # environment) hides any CUDA device from torch, so tests/test_gpu.py skips and nothing can touch
  # a card by accident.
  CUDA_VISIBLE_DEVICES: "-1"

jobs:
  test:
    # the Windows shards show in the job name ("windows-latest, Python 3.11, shard 0"); the others keep theirs
    name: "${{ matrix.os }}, Python 3.11${{ matrix.shard != 'all' && format(', shard {0}', matrix.shard) || '' }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GERMQUANT_GOLDEN_RTOL: ${{ matrix.golden_rtol }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            constraints: constraints/ci-cpu-2026-10.txt
            golden_rtol: "1e-12"
            shard: all
          # windows-latest runs the suite in two jobs (gate G1: 15 minutes per job); see the Test step
          - os: windows-latest
            constraints: constraints/ci-cpu-2026-10.txt
            golden_rtol: "1e-12"
            shard: "0"
          - os: windows-latest
            constraints: constraints/ci-cpu-2026-10.txt
            golden_rtol: "1e-12"
            shard: "1"
          # arm64 sums float32 intensity means in another order: one float32 step (about 1e-7 relative) in
          # nuclei.dna_mean_intensity of the synthetic goldens; the label images are identical (P0 pins).
          # macos-15: Apple Silicon, as macos-14 was until 2026-10-30 (the header's macOS runner paragraph).
          - os: macos-15
            constraints: constraints/ci-mac-arm64-2026-10.txt
            golden_rtol: "1e-6"
            shard: all
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv (the uv cache directory is saved between runs)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            constraints/ci-cpu-2026-10.txt
            constraints/ci-mac-arm64-2026-10.txt
            constraints/readers-2026-10.txt

      - name: Install torch and torchvision (CPU wheels from the PyTorch index)
        # Installed first and on their own, as the Dockerfile does, so no resolver can swap in the
        # default PyPI build (on Linux that is the CUDA wheel). "torch==2.11.0" matches the index's
        # 2.11.0+cpu build, and the next step sees its torch pin as already satisfied.
        if: runner.os != 'macOS'
        run: uv pip install --system --index-url https://download.pytorch.org/whl/cpu "torch==2.11.0" "torchvision==0.26.0"

      - name: Install torch and torchvision (macOS arm64 wheels from PyPI)
        # PyPI's macOS arm64 wheel is the CPU and Metal build; the PyTorch CPU index serves no macOS build.
        if: runner.os == 'macOS'
        run: uv pip install --system "torch==2.11.0" "torchvision==0.26.0"

      - name: Install germquant with the Cellpose, SpotMAX, SC-tracer, time-lapse (laptrack) and test extras
        # numba is named explicitly because SpotMAX imports it at load time without declaring it (it
        # would otherwise arrive only as a dependency of skan). Everything resolves against the pins.
        run: uv pip install --system -c ${{ matrix.constraints }} -e ".[gpu,spots,sc,dev,timelapse]" numba

      - name: Install the TIFF readers (bioio with its TIFF and OME-TIFF plugins, as in the workstation .venv)
        # constraints/readers-2026-10.txt pins bioio, bioio-base, the two readers and most of their
        # dependencies at the workstation .venv's versions, and the matrix constraints keep the packages they
        # pin at their CI pins. Thirteen packages that the readers bring in are pinned by neither file and
        # resolve to their newest releases: zarr, numcodecs, kerchunk, donfig, google-crc32c and ujson
        # (through tifffile[zarr], which the two readers ask for), msgpack, sortedcontainers, tblib, tornado
        # and zict (through distributed), and flexcache and flexparser (through pint). constraints/ is frozen
        # in Train B, so pinning them is a follow-up. The tests that need these readers (single-plane and
        # OME-TIFF reads through germquant.io, and Train B's project tests that read the test pack's OME-TIFF
        # example) then run on every system.
        run: uv pip install --system -c ${{ matrix.constraints }} -c constraints/readers-2026-10.txt bioio bioio-base bioio-tifffile bioio-ome-tiff

      - name: Check that the TIFF readers import
        # Those tests skip when a reader is missing (pytest.importorskip), so without this step a broken
        # readers install would pass as skipped tests. One command, so its exit code is the step's on every
        # shell (the Windows default, pwsh, takes only the last command's).
        run: python -c "import importlib.metadata as m, bioio, bioio_tifffile, bioio_ome_tiff; print(*(f'{d} {m.version(d)}' for d in ('bioio', 'bioio-base', 'bioio-tifffile', 'bioio-ome-tiff')))"

      - name: Record the resolved environment
        run: |
          uv pip freeze --system
          python -c "import germquant, torch; print('germquant', germquant.__version__, 'torch', torch.__version__, 'cuda', torch.cuda.is_available())"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        # The full suite minus the "model" marker; the synthetic golden tests are part of it.
        # ubuntu-latest and macos-15 (shard "all") run it in one job. windows-latest runs it in two (gate
        # G1, 15 minutes per job): shard 0 and shard 1 each take every other file of the sorted
        # tests/test_*.py list, so the two together run every test file once. A shard first fails if
        # pytest would collect a test file outside that list (one in a subfolder, or a *_test.py), which
        # neither shard would run, and if its own list is empty.
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.shard }}" = "all" ]; then
            pytest -q -rs -m "not model" --strict-markers
          else
            python -c "import pathlib, sys; t = pathlib.Path('tests'); m = sorted({p.as_posix() for g in ('test_*.py', '*_test.py') for p in t.rglob(g)} - {p.as_posix() for p in t.glob('test_*.py')}); sys.exit('test files outside tests/test_*.py, which no shard runs: ' + ' '.join(m) if m else 0)"
            files="$(python -c "import glob, sys; f = sorted(glob.glob('tests/test_*.py')); print(' '.join(f[int(sys.argv[1])::2]))" "${{ matrix.shard }}")"
            if [ -z "${files}" ]; then
              echo "shard ${{ matrix.shard }}: no test files"
              exit 1
            fi
            echo "shard ${{ matrix.shard }} of 0 and 1: ${files}"
            pytest -q -rs -m "not model" --strict-markers ${files}
          fi

      - name: T5 scope and style checks (frozen paths, fence pins and G7 style, tranche 5 branches only)
        # docs/DESIGN_system_packs.md section 11.2 and gate G3: a tranche 5 diff may not modify or delete
        # a frozen path (rules R1 and R8, tests/golden/synthetic/, tests/golden/synthetic_4ch/ and
        # tests/golden/real_manifest.json), delete the fence, or change or remove an existing pin in
        # tests/golden/default_invariants.json. It runs on tranche 5 branches only, because the RAD-51
        # work on other branches may legitimately update its own records: a branch, pull request head or
        # pull request base whose name contains "tranche5", contains a path segment that starts with
        # "t5" (feat/t5-p1, feat/t5/train-a) or starts with "t5". Every T5 package and integration
        # branch must be named that way. The step runs after Test, also when Test failed, so neither
        # result hides the other. It needs only git and the standard library, so one runner is enough.
        # The checkout above is shallow, so the step first fetches the history that the base needs.
        # scripts/t5_scope_check.py says how the base is chosen; a pull request is checked at its head
        # commit, not at the merge commit. The style check (gate G7, scripts/t5_style_check.py) runs next,
        # on the same head with the same base and also standard library only: no U+2013 or U+2014 in a
        # line the diff adds, and pure ASCII in the text files it adds under config/, packs/,
        # tests/fixtures/ and tests/golden/ and in every YAML file it adds. Both checks always run, and
        # the step fails when either fails.
        if: >-
          runner.os == 'Linux' && !cancelled() && (
          contains(github.ref_name, 'tranche5') || contains(github.head_ref, 'tranche5') ||
          contains(github.base_ref, 'tranche5') || contains(github.ref_name, '/t5') ||
          contains(github.head_ref, '/t5') || contains(github.base_ref, '/t5') ||
          startsWith(github.ref_name, 't5') || startsWith(github.head_ref, 't5') ||
          startsWith(github.base_ref, 't5'))
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --quiet --unshallow origin
          fi
          git fetch --no-tags --quiet origin "+refs/heads/main:refs/remotes/origin/main" || echo "no main branch on origin"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e "${head}^{commit}" 2>/dev/null || git fetch --no-tags --quiet origin "${head}"
          scope=0; python scripts/t5_scope_check.py --head "${head}" || scope=$?
          style=0; python scripts/t5_style_check.py --head "${head}" || style=$?
          if [ "${scope}" -ne 0 ] || [ "${style}" -ne 0 ]; then
            echo "T5 checks failed: scope check exit ${scope}, style check exit ${style}"
            exit 1
          fi
