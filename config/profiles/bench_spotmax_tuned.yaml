# Profile: SpotMAX (the deployed detector) with the parameters selected when it was re-tuned on the RAD-51
# benchmark's train and val gonads, as the competitor the benchmark protocol requires (package D3,
# 2026-10-10; docs/BENCHMARK.md, "Tuning on train and val"). Overlays config/config.yaml and changes only
# spots: keys (here gauss_sigma_um 0.08 -> 0.12 and effect_size_min 3.0 -> 3.5; the other two are the
# base values, written out); select it with `germquant run X.nd2 --profile bench_spotmax_tuned --out ...`.
#
# Status: a development result, not the deployed recipe. It was chosen by the pooled per-nucleus CCC
# against the Imaris truth on the 4 train gonads with usable spot truth (3 without heat shock, 1
# heat-shock hermaphrodite), then among the 3 best train sets on the 2 val hermaphrodites. It was never
# run on a test gonad, and no heat-shock male took part in choosing it (both training ones have unusable
# spot truth). gauss_sigma_um 0.12 was the largest smoothing searched and, at that smoothing, 3.5 the
# smallest effect size (3.5, 4.0, 4.5), so the best SpotMAX setting may lie outside the searched grid;
# the 24-set budget did not allow following it.
#
# Selected set: smS2_tri_r0.3_g0.12_e3.5, params sha256
# ec4917519441db8886c9d0037d114042c1ace703927640fa1a7173bcdce5f0cd (trial records in
# C:/Users/ryane/germquant_golden/benchmarks/n2rad51_8666f07/trials.jsonl, stages S2 and val).
extends: config.yaml

spots:
  thresholding_method: threshold_triangle   # as in config.yaml
  spot_radius_um: 0.3                        # as in config.yaml
  gauss_sigma_um: 0.12                       # 0.08 in config.yaml
  effect_size_min: 3.5                       # 3.0 in config.yaml
