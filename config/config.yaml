# =============================================================================
# germquant — global pipeline config.  Everything tunable lives here or in the
# referenced channel map.  Lengths/volumes are ALWAYS in microns (voxel size is
# read from each .nd2 and threaded through every 3D op — never hardcoded).
# =============================================================================
project: celegans-germline-quant

io:
  # which files to process when pointed at a folder (NAS root)
  input_glob: "**/*.nd2"
  # skip the 2D whole-slide overview scans (single-channel, no z) — not SC-quant
  exclude_patterns: ["*largeimage*", "*10x*", "*_10x_*"]
  # fluor -> biological role mapping for THIS experiment
  channel_map: config/channel_maps/n2_dapi_syp3_rad51.yaml

# Sample metadata parsed from the filename. Named regex groups become columns.
# Handles both naming styles in the dataset:
#   "20251105_n2_nohs_HERM _001", "20251021_n2_hs_MALE_2"   (sex = HERM/MALE)
#   "20260521_n2_hs_dapi_rad51_syp1_M001", "..._HERM001"     (channel block in name; sex = H/M)
# The (?:[a-z0-9]+_)*? lazily skips any channel/label tokens between treatment and the sex code.
metadata:
  filename_regex: '(?P<date>\d{6,8})_(?P<genotype>[A-Za-z0-9]+)_(?P<treatment>nohs|hs)_(?:[a-z0-9]+_)*?(?P<sex>HERM|MALE|H|M)\s*_?(?P<replicate>\d+)?\s*$'
  defaults: { genotype: unknown, sex: unknown, treatment: unknown, replicate: "NA" }

segmentation:
  nuclei:
    method: auto          # cellpose | classical | auto (cellpose if importable, else classical)
    cellpose_model: cpsam # 'cpsam' (Cellpose-SAM) or a path to a fine-tuned germline model
    diameter_um: 3.0      # approx pachytene nucleus diameter; -> pixels via voxel size
    min_volume_um3: 4.0   # drop debris below this
    channel: dna

sc:
  enabled: true
  channel: central_element     # SYP-3 here
  ridge_sigmas_um: [0.15, 0.25, 0.40]   # Sato tubeness scales (physical)
  # threshold (ridge percentile inside each nucleus). 99 keeps only the brightest speck
  # (~1um total/nucleus on real N2 data — ~20x too short); ~90 gives ~5um, ~80 gives ~9um.
  # MUST be calibrated against Imaris/SNT per-nucleus SC lengths (docs/RUNBOOK.md §5). Lower
  # also merges the 6 closely-packed SCs into fewer fragments — the dense-pachytene tradeoff
  # (ARCHITECTURE.md Risk 1); validate fragment COUNTS against ground truth before trusting them.
  intensity_percentile: 90.0
  min_fragment_length_um: 0.5           # ignore skeleton specks below this
  # headline readout for the heat phenotype = SC FRAGMENTATION:
  #   n_fragments per nucleus + fragment-length distribution + total length

foci:
  enabled: true
  channel: foci                # RAD-51 here
  min_sigma_um: 0.10
  max_sigma_um: 0.35
  threshold_rel: 0.10          # blob_log relative threshold
  count_in: all_zones          # RAD-51 across zones; crossover markers -> late_pachytene only

zones:
  enabled: true
  method: auto                 # dapi_crescent | synapsis_state | auto(dapi if present else synapsis)
  crescent_boundary: count_2plus   # count_2plus | pct_60   (NEVER 80% — see ARCHITECTURE.md)
  pachytene_thirds: true
  axis_bin_um: 5.0             # row width for zone scoring along the germline axis
  # crescent call: a nucleus is "polarized" (TZ-like) if its DAPI weighted-vs-geometric
  # centroid offset exceeds this many nuclear radii. Tune per dataset/resolution — real N2
  # data tops out ~0.13 at full res, so 0.18 finds no TZ (see docs/RUNBOOK.md §2).
  polarization_threshold: 0.10
  # Pachytene refinement (gradient-window): restrict the SC fragment readout to pachytene so the
  # whole-arm average doesn't dilute the heat phenotype. Gates on RAD-51 foci + SYP density
  # (early/TZ markers, INDEPENDENT of the SC count it restricts) + an SC-length floor. ADDITIVE:
  # adds is_pachytene + *_pachytene means alongside the whole-germline numbers, never replacing
  # them. v1 — calibrate thresholds vs Imaris/hand-scored zones before trusting restricted means.
  pachytene_refine: true
  pachytene_foci_thr_floor: 0.6   # RAD-51 foci/nucleus floor above which a region reads as early/TZ
  pachytene_ce_mult: 1.35         # SYP-density (central_element) early-cutoff = this x the p30 level
  pachytene_sc_floor_frac: 0.45   # keep nuclei with SC length >= this x the p60 level (synapsed)

axis:
  method: auto                 # auto (principal-curve centerline through nucleus centroids) | manual
  # below this -> flag for a manual axis-draw. This is an "is there an axis at all" gate: it
  # scales with germline tube width, so a healthy (thick) gonad reads ~0.5; a diffuse blob ~0.
  qc_confidence_min: 0.35

granules:                      # generic 3D-object module (off the critical path; none in N2 data)
  enabled: false               # needs a channel map with a `granule` role to do anything
  channel: granule
  threshold_method: li         # li | otsu
  min_volume_um3: 0.05         # drop sub-resolution specks

render:
  montage: true
  scalebar_um: 10

output:
  dir: null                    # null => mirror the input tree under <input_root>/../results
  formats: [csv, parquet]
  write_label_images: true     # save nucleus label masks (tif) for QC / re-use
