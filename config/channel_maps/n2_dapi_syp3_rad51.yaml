# Channel map for the Cahoon-lab DAPI / SYP / RAD-51 dataset (N2 + het mutants).
# .nd2 channels are named by laser line (e.g. 405/477/545; some acquisitions use 488/555), so we
# match on those names (case-insensitive substring) and fall back to channel index if a name is
# missing. `marker` is the antibody label that appears in the output tables.
match_by: name            # name | index
roles:
  dna:                      # nucleus channel -> Cellpose 3D segmentation
    names: ["405", "DAPI", "Hoechst"]
    index: 0
    required: true
    marker: DAPI
  central_element:          # SYP channel -> used to isolate the germline (gonad) from gut/debris
    names: ["477", "488", "SYP-3", "SYP3", "SYP-2", "SYP2", "SYP-1", "SYP1"]
    index: 1
    required: true
    marker: SYP
  foci:                     # RAD-51 channel -> counted per nucleus by the SpotMAX `spots` stage
    names: ["545", "555", "RAD-51", "RAD51"]
    index: 2
    required: false
    marker: RAD-51
