# Example channel map for a NO-DAPI experiment: zoning falls back to the
# axis-vs-central-element synapsis-state classifier (see ARCHITECTURE.md §3.4).
# Requires an AXIS marker (HTP-3 / HIM-3) AND a central-element marker (SYP-*).
match_by: name
roles:
  axis:                     # threshold on AXIAL/filamentous signal, not total
    names: ["HTP-3", "HTP3", "HIM-3", "HIM3"]
    index: 0
    required: true
    marker: HTP-3
  central_element:
    names: ["SYP-1", "SYP1", "SYP-2", "SYP-4"]
    index: 1
    required: true
    marker: SYP-1
  foci:
    names: ["COSA-1", "MSH-5", "ZHP-3", "RAD-51"]
    index: 2
    required: false
    marker: COSA-1
# dna role intentionally absent -> pipeline uses synapsis_state zoning (wild-type only).
