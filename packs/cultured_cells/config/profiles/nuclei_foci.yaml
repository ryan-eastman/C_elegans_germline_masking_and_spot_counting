# Cultured cells pack, recipe nuclei_foci (the default; dims projected). cultured_cells 0.1.0, provisional: these
# are starting values (docs/DESIGN_system_packs.md, section 3.12), not yet tuned, and the recipe is not validated.
#
# Nuclei are segmented by Cellpose-SAM on the maximum projection of the DNA channel, objects under 20 um2 are
# dropped, and the 2D masks are copied through every plane; foci are counted per nucleus in 3D by SpotMAX, the
# first focus channel (gamma-H2AX) as the main spots and a second one (53BP1) as the spots instance foci2.
# sharpen is off, so effect_size and effect_size_min are on SpotMAX's usual (unsharpened) scale. Runs on a CPU.
# Every worm stage switch, the neutral file-name regex and the QC settings sit in pack_base.yaml.
extends: pack_base.yaml

segmentation:
  nuclei:
    method: cellpose
    channel: dna
    cellpose_model: cpsam_v2@0f1cc3f7
    diameter_um: 12.0
    project: max
    min_area_um2: 20.0
    require_channel: true

spots:
  spot_radius_um: 0.3
  spot_radius_z_um: 0.6
  gauss_sigma_um: 0.08
  thresholding_method: threshold_triangle
  effect_size_min: 3.0
  merge_z_columns: true
  instances:
    - {name: foci2, role: foci2, expected_from_germ_cell: false}
